# 소개 사이트 + 웹 앱(PWA) + API 를 한 호스트에 올리는 nginx 설정. 운영 서버에 그대로 깔린 내용이다.
# 운영 사본은 /etc/nginx/sites-available/todobuddy (sites-enabled 에 링크). 저장소에서 고쳐도 자동 반영되지 않는다.
#   sudo install -m644 server/deploy/nginx-todobuddy-pwa.conf /etc/nginx/sites-available/todobuddy
#   sudo nginx -t && sudo systemctl reload nginx
#
# 트래픽: gsmsv 게이트웨이(Caddy, TLS 종료) → 이 VM 의 3000 → 아래에서 경로별로 나눈다.
# 게이트웨이는 서브도메인을 VM 포트 하나에 통째로 넘길 뿐 경로 설정을 못 하므로, 경로 분기를 여기서 한다.
#
#   /            → 127.0.0.1:3001 (소개 사이트 web/, systemd todobuddy-web)
#   /app/        → pwa/dist 정적 파일 (todobuddy-deploy 가 태그마다 다시 빌드해 바꿔 끼운다)
#   /api/        → 127.0.0.1:10000 (서버 .env 의 PORT. 접두어 /api 를 떼고 넘긴다)
#   /uploads/    → 127.0.0.1:10000 (프로필 사진)
#
# /app/ 은 pwa/vite.config.ts 의 BASE, 서버 .env 의 TODOBUDDY_WEB_PATH 와 같아야 한다.
# API·업로드는 /app 밖(호스트 루트)에 둔다. 저장된 프로필 사진 주소(/uploads/...)와 구글 콜백 주소가 그대로 유지된다.
#
# PWA 와 API 가 같은 출처여야 세션 쿠키(SameSite=Lax)와 CSRF 검사(Origin)가 맞아떨어진다.
# 서버 .env 에 TODOBUDDY_WEB_ORIGIN=https://todobuddy.https.gsmsv.site 를 넣고,
# 구글 콘솔의 "웹 애플리케이션" 클라이언트에 아래를 등록한다.
#   승인된 자바스크립트 원본: https://todobuddy.https.gsmsv.site
#   승인된 리디렉션 URI:      https://todobuddy.https.gsmsv.site/api/auth/google/callback
#
# www-data 가 pwa/dist 까지 들어갈 수 있어야 한다 (상위 디렉터리에 o+x).

# 게이트웨이가 넘긴 X-Forwarded-Proto(https)를 그대로 전달한다. $scheme 은 여기서 늘 http 다.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 3000;
    server_name _;

    absolute_redirect off;     # Location 에 내부 주소(:3000, http)가 새지 않게 상대 경로로 보낸다
    client_max_body_size 8m;   # 프로필 사진 (base64 로 5MB → JSON 약 7MB)

    location /api/ {
        proxy_pass http://127.0.0.1:10000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
    }

    # ----- 웹 앱 (/app/) -----

    location = /app { return 301 /app/; }

    # 해시가 붙은 자산은 영원히 캐시한다.
    location ^~ /app/assets/ {
        alias /home/ubuntu/todobuddy/pwa/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 서비스워커·매니페스트·index.html 은 매번 새로 확인해야 새 버전이 퍼진다.
    location = /app/sw.js {
        alias /home/ubuntu/todobuddy/pwa/dist/sw.js;
        add_header Cache-Control "no-cache";
    }
    location = /app/manifest.webmanifest {
        alias /home/ubuntu/todobuddy/pwa/dist/manifest.webmanifest;
        types { } default_type application/manifest+json;   # 기본 mime.types 에는 webmanifest 가 없다
        add_header Cache-Control "no-cache";
    }

    # SPA: /app/ 아래의 없는 경로는 index.html 로.
    location ^~ /app/ {
        alias /home/ubuntu/todobuddy/pwa/dist/;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /app/index.html;
    }

    # ----- 소개 사이트 (/) -----

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}
