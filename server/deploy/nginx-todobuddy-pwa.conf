# 웹 앱(PWA) 리버스 프록시 예시 (nginx). 운영 서버의 실제 프록시 설정에 맞춰 옮겨 적는다.
# 이 파일도 저장소에서 고쳐도 자동 반영되지 않는다.
#
#   /            → pwa/dist 정적 파일 (todobuddy-deploy 가 태그마다 다시 빌드해 바꿔 끼운다)
#   /api/        → 127.0.0.1:4000 (접두어 /api 를 떼고 넘긴다)
#   /uploads/    → 127.0.0.1:4000 (프로필 사진)
#
# PWA 와 API 가 같은 출처여야 세션 쿠키(SameSite=Lax)와 CSRF 검사(Origin)가 맞아떨어진다.
# 서버 .env 에 TODOBUDDY_WEB_ORIGIN=https://app.example.com 을 넣고,
# 구글 콘솔의 "웹 애플리케이션" 클라이언트에 아래를 등록한다.
#   승인된 자바스크립트 원본: https://app.example.com
#   승인된 리디렉션 URI:      https://app.example.com/api/auth/google/callback
#
# 프록시가 컨테이너 등 다른 네임스페이스에 있으면 서버를 HOST=0.0.0.0 으로 열고(.env),
# pwa/dist 를 컨테이너 안으로 마운트해야 한다. dist 는 배포 때 mv 로 통째로 바뀌므로 디렉터리가 아닌 상위(pwa/)를 마운트할 것.

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;
    # ssl_certificate / ssl_certificate_key 는 기존 설정을 따른다.

    root /home/ubuntu/todobuddy/pwa/dist;
    client_max_body_size 8m;   # 프로필 사진 (base64 로 5MB → JSON 약 7MB)

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # 해시가 붙은 자산은 영원히 캐시한다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 서비스워커·매니페스트·index.html 은 매번 새로 확인해야 새 버전이 퍼진다.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # SPA: 없는 경로는 index.html 로.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
