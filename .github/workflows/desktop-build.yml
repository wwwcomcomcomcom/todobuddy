name: 데스크탑 빌드

# master 에 들어오면 두 플랫폼이 깨지지 않는지 확인하고 아티팩트로 남긴다.
# 공개 배포는 v 로 시작하는 태그를 올렸을 때만 일어난다.
on:
  push:
    branches: [master]
    # 데스크탑 빌드에 영향을 주는 것만. 서버·소개 사이트·문서만 바뀌면 돌지 않는다.
    # 태그 푸시에는 경로 필터가 적용되지 않으므로 릴리스는 그대로 돈다.
    paths:
      - 'app/**'
      - '.github/workflows/desktop-build.yml'
    tags: ['v*']
  workflow_dispatch:

# 같은 ref 로 런이 두 개 뜨면 릴리스 단계가 서로 부딪힌다. 취소하지 않고 줄을 세운다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.4'
  # 배포 빌드가 바라볼 서버 주소. 저장소 변수(Settings > Variables)에 넣는다.
  # 비어 있으면 개발용 기본값으로 빌드되므로 내려받은 사람은 직접 서버를 띄워야 한다.
  TODOBUDDY_API: ${{ vars.TODOBUDDY_API || 'http://127.0.0.1:4000' }}

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 의존성 설치
        working-directory: app
        run: flutter pub get

      # 이 스크립트가 flutter build macos --release 부터 ad-hoc 서명, ZIP 생성까지 한다.
      - name: ZIP 빌드
        run: app/scripts/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: app/build/dist/*-macos.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 의존성 설치
        working-directory: app
        run: flutter pub get

      - name: 버전 읽기
        id: version
        shell: pwsh
        run: |
          $line = Get-Content app/pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          $version = ($line -split ':', 2)[1].Trim().Split('+')[0]
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 릴리스 빌드
        working-directory: app
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define="TODOBUDDY_API=$env:TODOBUDDY_API" `
            --dart-define="TODOBUDDY_APP_VERSION=${{ steps.version.outputs.version }}"

      - name: zip 으로 묶기
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path app/build/dist | Out-Null
          Compress-Archive -Path app/build/windows/x64/runner/Release/* `
            -DestinationPath "app/build/dist/TodoBuddy-$version-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: app/build/dist/*.zip
          if-no-files-found: error

  release:
    name: 릴리스
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Releases 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        # 재실행이나 중복 런에서도 실패하지 않도록, 이미 있으면 자산만 덮어쓴다.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "릴리스가 이미 있어 자산만 덮어쓴다: $GITHUB_REF_NAME"
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
