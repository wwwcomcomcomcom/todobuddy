name: 서버 · 웹 앱 검사

# PR 과 master 에 들어올 때 서버 테스트와 PWA(단위·빌드·e2e)를 돌린다.
# GitHub 호스팅 러너에서만 돈다. 운영 러너(todobuddy-prod)는 여기에 절대 쓰지 말 것 —
# 공개 저장소라 pull_request 트리거가 붙은 워크플로는 포크 PR 의 코드를 실행한다.
on:
  pull_request:
    paths:
      - 'server/**'
      - 'pwa/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pwa-ci.yml'
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'pwa/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pwa-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 테스트 · 빌드 · e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치
        run: npm ci --workspace server --workspace pwa --include-workspace-root

      - name: 서버 테스트
        run: npm run test:server

      - name: 타입 검사
        run: npm --workspace pwa run typecheck

      - name: PWA 단위 테스트
        run: npm run test:pwa

      - name: PWA 빌드
        run: npm run pwa:build

      - name: 브라우저 설치
        run: npx --workspace pwa playwright install --with-deps chromium

      # 시각 비교(@visual)는 글꼴이 OS 마다 달라 여기서 돌리지 않는다. 바꿨다면 로컬에서 확인할 것.
      - name: e2e (데스크탑 · 모바일 뷰포트)
        run: npm run e2e:pwa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: pwa/playwright-report
          retention-days: 7
